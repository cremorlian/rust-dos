[package]
name = "dos-pm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DOS protected-mode (DPMI) runtime: embedded-io console, exit, heap"

[dependencies]
embedded-io = "=0.7.1"
embedded-alloc = { version = "=0.7.0", optional = true, default-features = false, features = ["llff"] }
critical-section = { version = "=1.2.0", optional = true }

[features]
heap = ["embedded-alloc", "critical-section"]

[lints]
workspace = true