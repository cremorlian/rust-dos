name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          toolchain: nightly-2026-08-08
          components: rustfmt, clippy, rust-src
          rustflags: ""

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build cargo-dos for e2e
        run: cargo build -p cargo-dos

      - name: Run load-image e2e
        run: python3 scripts/verify_load_image.py
        env:
          CARGO_HOME: ${{ github.workspace }}/target/ci-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-08-08
