name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          nasm qemu-system-x86 mtools build-essential

      - name: Install dosemu2
        run: |
          sudo add-apt-repository -y ppa:dosemu2/ppa
          sudo apt-get update
          sudo apt-get install -y dosemu2
          dosemu --version

      - name: Build Bochs 3.1
        run: |
          curl -L --fail --retry 3 -o /tmp/bochs-3.1.tar.gz \
            https://downloads.sourceforge.net/project/bochs/bochs/3.1/bochs-3.1.tar.gz
          echo "14aaf78dbe1337987923fffc4e7a962ae56abcf9a87474ace39e593f9f84ee84  /tmp/bochs-3.1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bochs-3.1.tar.gz -C /tmp
          cd /tmp/bochs
          ./configure --prefix=/usr --with-nogui
          make -j"$(nproc)"
          sudo make install

      - name: Install dosbox-staging
        run: |
          sudo snap install --channel=latest/stable --revision=138 dosbox-staging
          dosbox-staging --version

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          toolchain: nightly-2026-08-08
          components: rustfmt, clippy, rust-src
          rustflags: ""

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build cargo-dos for e2e
        run: cargo build -p cargo-dos

      - name: Run load-image e2e
        run: python3 scripts/verify_load_image.py
        env:
          CARGO_HOME: ${{ github.workspace }}/target/ci-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-08-08

      - name: Run COM1 marker e2e
        run: python3 scripts/verify_com1_marker.py
        env:
          CARGO_HOME: ${{ github.workspace }}/target/ci-cargo-home
          RUSTUP_TOOLCHAIN: nightly-2026-08-08

      - name: Run qemu lane e2e
        run: python3 scripts/verify_qemu_freedos.py

      - name: Run Bochs lane e2e
        run: python3 scripts/verify_bochs_freedos.py

      - name: Run dosemu2 native e2e
        run: python3 scripts/verify_dosemu2.py
